<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1f3a">
<title>Thurso from Burnside to the Harbour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --navy:#0b1f3a; --heather:#6b4c8a; --thistle:#b48ec6; --gold:#d4a63a; --cream:#faf7f0;
  --bg:#faf7f0; --fg:#12233c; --card:#ffffff; --muted:#5a6675; --line:#e6ddca;
  --shadow:0 1px 3px rgba(11,31,58,.12);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0b1f3a; --fg:#eef2f8; --card:#12294a; --muted:#9fb0c6; --line:#22406b;
         --shadow:0 1px 3px rgba(0,0,0,.4); }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  background:var(--bg); color:var(--fg);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-weight:700;line-height:1.2;margin:0}

/* ---------- browser bar ---------- */
#browserbar{display:none;background:var(--navy);color:var(--cream);padding:12px 0}
#browserbar.on{display:block}
#browserbar [hidden]{display:none}
#browserbar p{margin:0;font-size:14px;color:var(--cream)}
#browserbar .bb-btns{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 0}
#browserbar .bb-btn{font:inherit;font-size:14px;font-weight:600;min-height:44px;padding:10px 16px;
  border-radius:8px;border:1px solid var(--gold);background:var(--gold);color:var(--navy);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:1 1 auto;
  text-decoration:none;-webkit-tap-highlight-color:transparent}
#browserbar .bb-btn:active{transform:translateY(1px)}
#bb-hint{margin:10px 0 0;font-size:13px;color:var(--thistle)}
#bb-url{display:block;width:100%;min-height:44px;margin:10px 0 0;padding:10px 12px;
  font:inherit;font-size:14px;border-radius:8px;border:1px solid var(--gold);
  background:var(--cream);color:var(--navy)}
@media (max-width:400px){ #browserbar .bb-btn{flex:1 1 100%} }

/* ---------- header ---------- */
header{background:var(--navy);color:#fff;padding:22px 0 0}
header h1{font-size:28px;letter-spacing:.2px}
.loc{font-size:15px;color:var(--thistle);margin:6px 0 0}
.meta{font-size:14px;color:#cdd8e6;margin:10px 0 0}
.badge{display:inline-block;margin:12px 0 0;padding:4px 12px;border-radius:999px;
  background:var(--gold);color:var(--navy);font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.09em}
.headbtns{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 18px}
.tartan{height:6px;background:repeating-linear-gradient(90deg,
  #0b1f3a 0 14px,#6b4c8a 14px 22px,#0b1f3a 22px 26px,
  #d4a63a 26px 29px,#0b1f3a 29px 40px,#b48ec6 40px 46px,#0b1f3a 46px 52px)}

/* ---------- buttons ---------- */
button,.btn{
  font:inherit;font-size:14px;font-weight:600;min-height:44px;padding:10px 16px;
  border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  text-decoration:none;-webkit-tap-highlight-color:transparent;
}
button:active,.btn:active{transform:translateY(1px)}
.btn-gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
button[disabled]{opacity:.5;cursor:default}

/* ---------- intro ---------- */
#intro{padding:22px 0 4px}
#intro p{margin:0 0 14px;font-size:17px}

/* ---------- map ---------- */
#map{height:45vh;min-height:280px;width:100%;background:var(--line);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);z-index:0}
.pin{background:none;border:none}
.pin span{
  display:flex;align-items:center;justify-content:center;
  width:30px;height:30px;border-radius:50%;
  background:var(--gold);color:var(--navy);
  font-weight:700;font-size:15px;border:2px solid #fff;
  box-shadow:0 1px 4px rgba(0,0,0,.45)}
.pin.done span{background:#b9c2cd;color:#4a5564}
.me{background:none;border:none}
.me i{display:block;width:16px;height:16px;border-radius:50%;background:#1e7bf0;
  border:2px solid #fff;animation:pulse 1.8s infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(30,123,240,.55)}
  70%{box-shadow:0 0 0 16px rgba(30,123,240,0)}
  100%{box-shadow:0 0 0 0 rgba(30,123,240,0)}}
.leaflet-popup-content{font-size:14px;margin:10px 12px}
.leaflet-popup-content b{font-family:"Playfair Display",Georgia,serif}

/* ---------- geo bar ---------- */
#geobar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0}
#geostatus{font-size:14px;color:var(--muted);flex:1 1 180px;min-width:0}

/* ---------- stop cards ---------- */
.stop{background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);margin:0 0 18px;overflow:hidden}
.stop.visited{opacity:.62}
.stop.visited .num{background:#b9c2cd;color:#4a5564}
.stophead{display:flex;gap:12px;align-items:flex-start;padding:16px 16px 0}
.num{flex:none;width:44px;height:44px;min-height:44px;border-radius:50%;
  background:var(--gold);color:var(--navy);
  font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;
  border:none;padding:0;font-family:"Playfair Display",Georgia,serif}
.stophead h2{font-size:21px;margin:4px 0 0;min-width:0;overflow-wrap:break-word}
.teaser{color:var(--muted);font-size:15px;font-style:italic;margin:10px 16px 0}
.shot{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;margin:14px 0 0;background:var(--line)}
.ph{width:100%;aspect-ratio:16/10;margin:14px 0 0;display:flex;align-items:center;justify-content:center;
  gap:14px;background:linear-gradient(135deg,var(--navy),var(--heather));color:var(--gold)}
.ph b{font-family:"Playfair Display",Georgia,serif;font-size:56px;line-height:1}
.credit{display:block;font-size:11px;color:var(--muted);padding:6px 16px 0;text-align:right}
.credit a{color:var(--muted)}
.narr{margin:14px 16px 0;font-size:16.5px}
.tip{margin:14px 16px 0;padding:11px 14px;border-left:3px solid var(--heather);
  background:rgba(107,76,138,.09);border-radius:0 8px 8px 0;font-size:14.5px}
.tip b{color:var(--heather)}
.row{display:flex;gap:10px;flex-wrap:wrap;padding:16px}
.visited-tick{color:var(--heather);font-weight:700}

/* ---------- now playing ---------- */
#now{position:fixed;left:0;right:0;bottom:0;z-index:900;background:var(--navy);color:#fff;
  display:none;align-items:center;gap:12px;padding:12px 16px;
  box-shadow:0 -2px 12px rgba(0,0,0,.3);padding-bottom:calc(12px + env(safe-area-inset-bottom))}
#now.on{display:flex}
#nowtxt{flex:1 1 auto;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.playing{padding-bottom:76px}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);margin-top:10px;padding:20px 0 34px;
  font-size:12.5px;color:var(--muted);text-align:center}
footer a{color:var(--muted)}
.fallback{padding:40px 0;color:var(--muted)}
</style>
</head>

<script>
const TOUR = {"slug": "thurso-6-0914", "title": "Thurso from Burnside to the Harbour", "location": "Thurso, Caithness", "intro": "A flat walk from Burnside on the western edge of Thurso, along the shore of Thurso Bay and into Sir John Sinclair's planned town, finishing at the old harbour with the castle ruin across the river. About two kilometres one way, roughly an hour and a quarter with the stops, and the same distance back along the beach.", "flavour": "general", "generated": "2026-09-14", "anchor": {"lat": 58.5978, "lon": -3.5395}, "totalKm": 1.89, "estMinutes": 76, "stops": [{"n": 1, "title": "Burnside and the Wolf Burn", "teaser": "The western edge of the most northerly town on the British mainland, and the burn that gave a whisky its name.", "narration": "Before you set off, take a breath of that air. It has come straight across the Pentland Firth with nothing in the way, and you are standing at the western edge of Thurso, the most northerly town on the mainland of Britain. The name is Norse. The Vikings who settled Caithness called the river Thorsa, and it has been a market town and a port ever since. The small stream running down to the bay beside you is the Wolf Burn, and it has a story. In eighteen twenty one a man called William Smith built a distillery on its banks, drawing water from the burn, and for a few decades Wolfburn was one of the larger distilleries in the north before it faded away and fell into ruin. Then in twenty twelve a new distillery of the same name was built a few hundred metres from the old site, using the same water. The first spirit ran in January twenty thirteen and the first whisky was bottled three years later, which makes it one of the youngest and most northerly distilleries on the mainland. Look for the low grey buildings of Henderson Park up the slope to the west, and for the burn itself where it slips under the road towards the shore. Now follow the road east with the sea on your left, and the sand of Thurso Beach will open up in front of you.", "tip": null, "lat": 58.5978, "lon": -3.5395, "image": null, "imageCredit": null, "wiki": "https://en.wikipedia.org/wiki/Wolfburn_distillery", "source": "knowledge"}, {"n": 2, "title": "Thurso Beach and Esplanade", "teaser": "A broad sweep of sand looking straight across the Pentland Firth to Orkney.", "narration": "Stop on the esplanade and look out to sea. On a clear day the long dark hump on the horizon is the island of Hoy in Orkney, with the tall cliffs of Saint John's Head at its western end, and that stretch of water between you and it is the Pentland Firth, where some of the fastest tidal currents in the world run at up to twelve knots. To your right the headland with the lighthouse is Dunnet Head, the true most northerly point of mainland Britain, further north than John o' Groats. To your left the cliffs of Holborn Head shelter the ferry port at Scrabster, where the boat leaves for Stromness. The bay curves for about a mile between the Wolf Burn and the mouth of the River Thurso, and the town grew up on the flat ground behind it. Look down at the sand, and if the swell is running, look for the surfers. Thurso has a reef break at the east end of the bay, off the castle, that is rated among the best cold water waves in Europe, and it hosted an international professional contest for several years. The water is rarely much above ten degrees, so wetsuits are thick and the surfers are hardy. When you are ready, turn inland up any of the streets on your right and walk two or three blocks to Sir John's Square, the heart of the planned town.", "tip": null, "lat": 58.5978, "lon": -3.5245, "image": null, "imageCredit": null, "wiki": "https://en.wikipedia.org/wiki/Thurso", "source": "knowledge"}, {"n": 3, "title": "Sir John's Square", "teaser": "The formal square at the centre of a town laid out by the man who invented statistics.", "narration": "This neat square is the work of one extraordinary man. Sir John Sinclair of Ulbster was born in Thurso Castle in seventeen fifty four and spent his life improving things, whether anyone asked him to or not. He was a member of Parliament for over thirty years, he founded the Board of Agriculture, and between seventeen ninety one and seventeen ninety nine he badgered every parish minister in Scotland into answering a questionnaire about their district, producing the Statistical Account of Scotland in twenty one volumes. He is generally credited with bringing the word statistics into the English language. At the end of the seventeen nineties he laid out a new town for Thurso on a grid of straight streets around this square, in the same spirit as the New Town of Edinburgh but on a Caithness budget. Look for his statue in the centre, standing in the robes he was rather fond of, and then look at the church behind it. Saint Peter's and Saint Andrew's was built in the early eighteen thirties to a design by the Edinburgh architect William Burn, and it replaced the old kirk down by the harbour, which you will see later. The grid of streets around you still has his stamp, with the flat Caithness flagstone underfoot that the county once exported all over the world. Now walk a short way south to the Town Hall on High Street.", "tip": null, "lat": 58.5952, "lon": -3.5215, "image": null, "imageCredit": null, "wiki": "https://en.wikipedia.org/wiki/John_Sinclair,_1st_Baronet", "source": "knowledge"}, {"n": 4, "title": "Thurso Town Hall and the Meadow Well", "teaser": "A Victorian town hall full of Pictish stones, and the well that once watered the whole town.", "narration": "The handsome Victorian building in front of you was built in the early eighteen seventies as Thurso Town Hall, and it now holds the North Coast Visitor Centre, which is the town museum under a newer name. If it is open it is well worth half an hour. The treasures inside are two carved Pictish stones from the surrounding countryside, the Ulbster Stone and the Skinnet Stone, covered in crosses, beasts and the mysterious symbols that nobody has fully decoded, and carved more than a thousand years ago before the Vikings arrived. There is also an exhibition on Dounreay, the experimental nuclear site along the coast to the west, which doubled the size of Thurso in the nineteen fifties and sixties and brought engineers from all over Britain to this quiet corner. Many of the modern housing estates on the edge of town date from that boom. Look for the little octagonal stone building nearby, the Meadow Well. It was built in the eighteen twenties over a spring that served as the main water supply for the townsfolk, who came with buckets and carts until piped water arrived decades later. It is one of those small structures that everybody in town walks past and nobody notices. Now head back down towards the river and follow the lanes north to the oldest building in Thurso, Old Saint Peter's Kirk.", "tip": "The old Town Hall houses the North Coast Visitor Centre with the town museum and Pictish stones. Check the opening times before you rely on it, as they change with the season.", "lat": 58.5944, "lon": -3.5205, "image": null, "imageCredit": null, "wiki": "https://en.wikipedia.org/wiki/Thurso", "source": "knowledge"}, {"n": 5, "title": "Old St Peter's Kirk", "teaser": "A roofless medieval kirk by the river mouth that served the town for six hundred years.", "narration": "This roofless ruin is where Thurso began. A church has stood on this spot since at least the thirteenth century, and tradition credits its founding to Gilbert de Moravia, the Bishop of Caithness, who was later made a saint. The oldest surviving stonework is in the small chancel at the east end, and the rest of the building was patched, extended and rebuilt over the centuries, most heavily in the sixteen hundreds. For six hundred years this was the parish church, and it was also where the town's business was done, with the council and the court meeting inside its walls. It was finally abandoned in eighteen thirty two when Sir John Sinclair's fine new church opened in the square you have just left, and the roof came off soon after. Look for the tall pointed window in the south wall with its unusual stone tracery, which is far grander than anything else in the building and was clearly meant to impress. Then wander among the gravestones, where you will find the names of fishermen, merchants and mariners, some of them lost at sea in the Pentland Firth. The lanes around you are the Fisherbiggins, the old fishing quarter, with its low cottages huddled against the wind. The harbour is just a minute further on, and from there you can see the castle.", "tip": "The kirk is a ruin in a graveyard and is usually locked, but you can see everything that matters from the path around it.", "lat": 58.5975, "lon": -3.5168, "image": null, "imageCredit": null, "wiki": "https://en.wikipedia.org/wiki/Old_St_Peter%27s_Church,_Thurso", "source": "knowledge"}, {"n": 6, "title": "Thurso Harbour and Thurso Castle", "teaser": "The old fishing harbour at the river mouth, and a baronial ruin glowering from the far bank.", "narration": "You have reached the mouth of the River Thurso, and this small harbour is where the town earned its living for centuries. Grain, flagstones and salt fish went out from here, and in the eighteen hundreds the herring boats packed the quay every summer. The river itself is one of the finest salmon rivers in the north, and anglers still stand in it upstream through the summer months. Now look across the water to the east bank. The jagged ruin on the headland is Thurso Castle, the ancestral home of the Sinclairs of Ulbster, the family of Sir John whose statue you saw in the square. There has been a castle on that site since the Middle Ages, but what you see today is the shell of a Scots baronial mansion built in eighteen seventy two for Sir Tollemache Sinclair, the third Baronet. It was a huge, turreted, showy house, and it lasted barely eighty years. Damaged and neglected, most of it was pulled down in nineteen fifty two, leaving the dramatic outline you see now. Look for the surviving gatehouse and the towers against the sky, which are best when the evening light comes in from the west. The reef the surfers ride breaks just below the castle. From here you can wander back along the beach to Burnside, or take the flat streets of the town, either way about a mile and a half.", "tip": "Thurso Castle is privately owned and the grounds are not open to the public. Look at it from the harbour or the beach and do not try to get closer.", "lat": 58.5988, "lon": -3.5152, "image": null, "imageCredit": null, "wiki": "https://en.wikipedia.org/wiki/Thurso_Castle", "source": "knowledge"}]};
</script>

(function(){

      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

    var h=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);

    '<path d="M8.6 6h6.8c0 2.7-1.5 4.6-3.4 4.6S8.6 8.7 8.6 6z"/>' +

            encodeURIComponent(s.lat+","+s.lon)+'&amp;travelmode=walking">&#10152;&nbsp; Directions</a>';
    html += '<button type="button" data-act="visit" data-n="'+n+'">'+
            (done?'<span class="visited-tick">&#10003;</span>&nbsp; Visited':'&#9711;&nbsp; Mark visited')+'</button>';
    html += '</div></article>';
  }
  $("stops").innerHTML = html;

  function paintCard(n){
    var card=$("stop-"+n); if(!card) return;
    var done=!!visited[n];
    card.className = "stop"+(done?" visited":"");
    var b=card.querySelector('[data-act="visit"]');
    if(b) b.innerHTML = done ? '<span class="visited-tick">&#10003;</span>&nbsp; Visited'
                             : '&#9711;&nbsp; Mark visited';
    if(markers[n] && markers[n].getElement && markers[n].getElement())
      markers[n].getElement().classList.toggle("done", done);
  }

  /* ---------- map ---------- */
  var map=null, markers={}, meDot=null, meRing=null;
  if (window.L && stops.length){
    map = L.map("map",{scrollWheelZoom:false});
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
      maxZoom:19,
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    var pts=[];
    for (var j=0;j<stops.length;j++){
      var st=stops[j], nn=st.n||(j+1);
      if (typeof st.lat!=="number" || typeof st.lon!=="number") continue;
      pts.push([st.lat, st.lon]);
      var mk = L.marker([st.lat,st.lon],{
        icon: L.divIcon({className:"pin"+(visited[nn]?" done":""), html:"<span>"+nn+"</span>",
                         iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-16]})
      }).addTo(map);
      mk.bindPopup("<b>"+esc(st.title)+"</b><br>Stop "+nn);
      (function(num){
        mk.on("click", function(){ var c=$("stop-"+num); if(c) c.scrollIntoView({behavior:"smooth",block:"start"}); });
      })(nn);
      markers[nn]=mk;
    }
    if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.18));

    /* straight-line fallback drawn only if OSRM does not answer */
    var routed=false;
    function straight(){
      if (routed || pts.length<2) return;
      routed=true;
      L.polyline(pts,{color:"#6b4c8a",weight:4,opacity:.8,dashArray:"7 7"}).addTo(map);
    }
    if (pts.length>1 && typeof window.fetch==="function"){
      var coords=[]; for (var k=0;k<pts.length;k++) coords.push(pts[k][1]+","+pts[k][0]);
      var url="https://router.project-osrm.org/route/v1/foot/"+coords.join(";")+"?overview=full&geometries=geojson";
      var ctrl = (typeof AbortController==="function") ? new AbortController() : null;
      var timer = setTimeout(function(){ if(ctrl){ try{ ctrl.abort(); }catch(e){} } straight(); }, 6000);
      fetch(url, ctrl?{signal:ctrl.signal}:{})
        .then(function(r){ return r.ok ? r.json() : Promise.reject(new Error("osrm")); })
        .then(function(d){
          clearTimeout(timer);
          var g = d && d.routes && d.routes[0] && d.routes[0].geometry;
          if (routed || !g || !g.coordinates || !g.coordinates.length) { straight(); return; }
          routed=true;
          var line=[]; for (var m=0;m<g.coordinates.length;m++) line.push([g.coordinates[m][1], g.coordinates[m][0]]);
          L.polyline(line,{color:"#6b4c8a",weight:5,opacity:.85}).addTo(map);
        })
        .catch(function(){ clearTimeout(timer); straight(); });
    } else {
      straight();
    }
  }

  /* ---------- speech ---------- */
  var synth = ("speechSynthesis" in window) ? window.speechSynthesis : null;
  var voice=null, queue=[], qi=-1, single=-1;

  function pickVoice(){
    if(!synth || !synth.getVoices) return;
    var vs = synth.getVoices() || [], i;
    for (i=0;i<vs.length;i++) if (/scot/i.test(vs[i].name||"")) { voice=vs[i]; return; }
    for (i=0;i<vs.length;i++) if ((vs[i].lang||"").toLowerCase().replace("_","-")==="en-gb") { voice=vs[i]; return; }
    voice=null;
  }
  if (synth){ pickVoice(); if ("onvoiceschanged" in synth) synth.onvoiceschanged = pickVoice; }

  function resetButtons(){
    var bs=document.querySelectorAll('[data-act="say"]'), i;
    for(i=0;i<bs.length;i++) bs[i].innerHTML="&#9654;&nbsp; Listen";
    var pi=$("playintro"); if(pi) pi.innerHTML="&#9654;&nbsp; Play intro";
    $("playall").innerHTML="&#9654;&nbsp; Play whole tour";
  }
  function showNow(txt){
    var bar=$("now");
    if (txt){ $("nowtxt").textContent=txt; bar.classList.add("on"); document.body.classList.add("playing"); }
    else { bar.classList.remove("on"); document.body.classList.remove("playing"); }
  }
  function stopAll(){
    queue=[]; qi=-1; single=-1;
    if (synth) { try{ synth.cancel(); }catch(e){} }
    resetButtons(); showNow("");
  }
  function utter(text, onend){
    if (!synth) return false;
    var u = new SpeechSynthesisUtterance(text);
    u.rate=0.95; u.lang="en-GB";
    if (voice) u.voice=voice;
    u.onend = onend || null;
    u.onerror = onend || null;
    try { synth.speak(u); } catch(e){ return false; }
    return true;
  }
  function noSpeech(){
    showNow("Speech is not available on this browser.");
    setTimeout(function(){ showNow(""); }, 3000);
  }

  function sayOne(n){
    if (!synth) { noSpeech(); return; }
    if (single === n){ stopAll(); return; }
    stopAll();
    var s=null; for (var i=0;i<stops.length;i++) if ((stops[i].n||(i+1))===n) s=stops[i];
    if (!s) return;
    single = n;
    var btn = document.querySelector('[data-act="say"][data-n="'+n+'"]');
    if (btn) btn.innerHTML="&#9632;&nbsp; Stop";
    showNow("Now playing: stop " + n);
    utter((s.title||"") + ". " + (s.narration||""), function(){
      if (single===n){ single=-1; resetButtons(); showNow(""); }
    });
  }
  function sayIntro(){
    if (!synth) { noSpeech(); return; }
    if (single === 0){ stopAll(); return; }
    stopAll(); single = 0;
    $("playintro").innerHTML="&#9632;&nbsp; Stop";
    showNow("Now playing: introduction");
    utter(TOUR.intro || "", function(){
      if (single===0){ single=-1; resetButtons(); showNow(""); }
    });
  }
  function step(){
    if (qi < 0 || qi >= queue.length){ stopAll(); return; }
    var item = queue[qi];
    showNow("Now playing: " + item.label);
    if (item.scroll){ var c=$("stop-"+item.scroll); if(c) c.scrollIntoView({behavior:"smooth",block:"start"}); }
    utter(item.text, function(){ if(qi<0) return; qi++; step(); });
  }
  function playAll(){
    if (!synth) { noSpeech(); return; }
    if (qi > -1){ stopAll(); return; }
    stopAll();
    queue = [{label:"introduction", text:TOUR.intro||"", scroll:0}];
    for (var i=0;i<stops.length;i++){
      var s=stops[i], n=s.n||(i+1);
      queue.push({label:"stop "+n+" · "+(s.title||""), text:(s.title||"")+". "+(s.narration||""), scroll:n});
    }
    qi = 0;
    $("playall").innerHTML="&#9632;&nbsp; Stop tour";
    step();
  }

  /* ---------- geolocation (user gesture only, never on load) ---------- */
  var watchId=null;
  function geoStatus(t){ $("geostatus").textContent=t; }
  function locate(){
    if (!navigator.geolocation){ geoStatus("This browser cannot share your location."); return; }
    if (watchId!==null){
      navigator.geolocation.clearWatch(watchId); watchId=null;
      if (map && meDot){ map.removeLayer(meDot); meDot=null; }
      if (map && meRing){ map.removeLayer(meRing); meRing=null; }
      $("locate").innerHTML="&#9678;&nbsp; Locate me";
      geoStatus("Location off. Tap “Locate me” to turn it back on.");
      return;
    }
    geoStatus("Finding you…");
    $("locate").innerHTML="&#9678;&nbsp; Stop locating";
    watchId = navigator.geolocation.watchPosition(onPos, onGeoErr, {
      enableHighAccuracy:true, maximumAge:5000, timeout:20000
    });
  }
  function onPos(pos){
    var la=pos.coords.latitude, lo=pos.coords.longitude, acc=pos.coords.accuracy||0;
    if (map){
      if (!meDot){
        meDot = L.marker([la,lo],{icon:L.divIcon({className:"me",html:"<i></i>",iconSize:[16,16],iconAnchor:[8,8]}),
                                  zIndexOffset:1000}).addTo(map);
        meRing = L.circle([la,lo],{radius:acc,color:"#1e7bf0",weight:1,fillColor:"#1e7bf0",fillOpacity:.10}).addTo(map);
      } else {
        meDot.setLatLng([la,lo]); meRing.setLatLng([la,lo]); meRing.setRadius(acc);
      }
    }
    var best=null;
    for (var i=0;i<stops.length;i++){
      var s=stops[i], n=s.n||(i+1);
      if (visited[n]) continue;
      if (typeof s.lat!=="number" || typeof s.lon!=="number") continue;
      var d=hav(la,lo,s.lat,s.lon);
      if (!best || d<best.d) best={d:d,n:n,title:s.title};
    }
    if (!best) geoStatus("Every stop is marked visited. Well walked.");
    else geoStatus("You are " + far(best.d) + " from stop " + best.n + " · " + best.title);
  }
  function onGeoErr(err){
    $("locate").innerHTML="&#9678;&nbsp; Locate me";
    if (watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
    var msg = "Could not get your location. Carry on with the map.";
    if (err && err.code===1) msg = "Location permission was declined. The tour works fine without it.";
    else if (err && err.code===2) msg = "No location signal here. Try again outdoors.";
    else if (err && err.code===3) msg = "Location is taking too long. Try again in a moment.";
    geoStatus(msg);
  }

  /* ---------- events (delegated) ---------- */
  document.addEventListener("click", function(ev){
    var b = ev.target.closest ? ev.target.closest("[data-act]") : null;
    if (!b) return;
    var n = Number(b.getAttribute("data-n")), act = b.getAttribute("data-act");
    if (act==="say")   { sayOne(n); }
    else if (act==="visit"){ visited[n] = !visited[n]; saveVisited(); paintCard(n); }
    else if (act==="map")  {
      if (!map || !markers[n]) return;
      map.setView(markers[n].getLatLng(), Math.max(map.getZoom(), 17), {animate:true});
      markers[n].openPopup();
      $("map").scrollIntoView({behavior:"smooth",block:"center"});
    }
  });
  $("playall").addEventListener("click", playAll);
  $("playintro").addEventListener("click", sayIntro);
  $("nowstop").addEventListener("click", stopAll);
  $("locate").addEventListener("click", locate);
  window.addEventListener("pagehide", function(){ if(synth){ try{ synth.cancel(); }catch(e){} } });
})();
</script>
<script>
(function(){
  "use strict";

  function init(){
    var bar = document.getElementById("browserbar");
    if (!bar) return;

    /* only in an in-app WebView, or anywhere speech is missing */
    var ua = navigator.userAgent || "";
    var android = /Android/i.test(ua);
    var noTts = !("speechSynthesis" in window);
    var webview = android && (/\bwv\b/.test(ua) || noTts);
    if (!(webview || noTts)) return;

    function $(id){ return document.getElementById(id); }
    var here = window.location;
    var back = encodeURIComponent(here.href);
    function intent(pkg){
      return "intent://" + here.host + here.pathname + here.search +
             "#Intent;scheme=https;package=" + pkg +
             ";S.browser_fallback_url=" + back + ";end";
    }

    var chrome=$("bb-chrome"), edge=$("bb-edge"), copy=$("bb-copy"),
        hint=$("bb-hint"), box=$("bb-url");

    if (chrome) chrome.href = intent("com.android.chrome");
    if (edge)   edge.href   = intent("com.microsoft.emmx");

    function armHint(){
      setTimeout(function(){
        if (hint && document.visibilityState === "visible") hint.hidden = false;
      }, 1500);
    }
    if (chrome) chrome.addEventListener("click", armHint);
    if (edge)   edge.addEventListener("click", armHint);

    function showBox(){
      if (!box) return;
      box.value = here.href;
      box.hidden = false;
      try { box.focus(); box.select(); } catch(e){}
    }
    if (copy) copy.addEventListener("click", function(){
      function copied(){
        copy.textContent = "Copied";
        setTimeout(function(){ copy.textContent = "Copy link"; }, 2000);
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(here.href).then(copied, showBox);
          return;
        }
      } catch(e){}
      showBox();
    });

    bar.classList.add("on");
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
